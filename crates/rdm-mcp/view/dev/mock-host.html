<!doctype html>
<!-- Query flags: mode=result|chunks|stream, scale=1..100, serverTools=1, mc=0, msg=0, modes=inline, theme=dark.
     Dev only: not built, not shipped. Serve crates/rdm-mcp/view with `python3 dev/mock-server.py 8765`
     (static files + the SSE endpoint) and open /dev/mock-host.html?run=cold&mode=stream  (add &modes=inline to hide fullscreen). -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>mock MCP Apps host</title>
<style>
  body { font: 13px system-ui, sans-serif; margin: 8px; }
  #frame { width: 100%; height: 420px; border: 1px solid #888; }
  #frame.fs { position: fixed; inset: 0; height: 100vh; z-index: 9; background: #fff; }
  pre { background: #f3f3f3; padding: 6px; max-height: 240px; overflow: auto; font-size: 11px; }
</style>
</head>
<body>
<h3>mock host <small id="state"></small></h3>
<iframe id="frame" title="view"></iframe>
<h4>message log</h4>
<pre id="log"></pre>
<script>
const q = new URLSearchParams(location.search);
const run = q.get('run') || 'cold';
const modes = (q.get('modes') || 'inline,fullscreen').split(',');
const frame = document.getElementById('frame');
const logEl = document.getElementById('log');
const stateEl = document.getElementById('state');
window.probes = [];
function log(dir, m) { logEl.textContent += dir + ' ' + JSON.stringify(m).slice(0, 400) + '\n'; }
function post(m) { log('host->view', m); frame.contentWindow.postMessage(m, '*'); }
function reply(id, result) { post({ jsonrpc: '2.0', id, result }); }
const hostContext = {
  theme: q.get('theme') || 'light', displayMode: 'inline', availableDisplayModes: modes,
  containerDimensions: { width: 900, maxHeight: 600 }, platform: 'web', locale: 'en-US',
};
// Desktop-like capabilities: NO serverTools unless ?serverTools=1.
const hostCapabilities = { openLinks: {}, serverResources: {}, message: { text: {} },
  ...(q.get('serverTools') === '1' ? { serverTools: {} } : {}),
  ...(q.get('mc') === '0' ? {} : { updateModelContext: { text: {} } }) };
if (q.get('msg') === '0') delete hostCapabilities.message;

const mode = q.get('mode') || 'result';          // result | chunks | stream
const scale = Math.max(1, Math.min(100, +(q.get('scale') || 1)));
const CHUNK = 20;
window.messages = []; window.modelContexts = [];
let base = null;
async function allNodes() {
  base ??= (await (await fetch('sample-roadmap.json')).json()).nodes;
  if (scale === 1) return base;
  const out = [];
  for (let i = 0; i < scale; i++) for (const n of base)
    out.push({ ...n, path: `s${i}/${n.path}`, parent: n.parent ? `s${i}/${n.parent}` : `s${i}` });
  return out;
}

async function toolResult() {
  const nodes = await allNodes();
  const sc = { mode, scale, t_server_ms: Date.now(), payload_bytes: JSON.stringify(nodes).length, node_count: nodes.length };
  if (mode === 'result') {
    sc.nodes = nodes.map((n) => n.kind === 'leaf' && scale === 1 ? { ...n, markdown: '# ' + n.title + '\n(inline markdown)' } : n);
  } else if (mode === 'chunks') {
    sc.chunk_count = Math.ceil(nodes.length / CHUNK);
    sc.chunk_uri_template = 'rdm://chunk/{n}?scale=S';
  } else {
    sc.stream_url = location.origin + '/stream?scale=' + scale;
  }
  post({ jsonrpc: '2.0', method: 'ui/notifications/tool-input', params: { arguments: { mode, scale } } });
  post({ jsonrpc: '2.0', method: 'ui/notifications/tool-result', params: {
    content: [{ type: 'text', text: `${nodes.length} nodes (${mode})` }], structuredContent: sc } });
}

async function readResource(id, uri) {
  let m;
  if ((m = uri.match(/^rdm:\/\/chunk\/(\d+)\?scale=(\d+)$/))) {
    const nodes = await allNodes();
    const n = +m[1];
    const text = JSON.stringify({ n, nodes: nodes.slice(n * CHUNK, (n + 1) * CHUNK) });
    return reply(id, { contents: [{ uri, mimeType: 'application/json', text }] });
  }
  if ((m = uri.match(/^rdm:\/\/leaf\/(.+)$/))) {
    const r = await fetch('sample-leaves/' + m[1]);
    const text = r.ok ? await r.text() : '(no sample leaf for ' + m[1] + ')';
    return reply(id, { contents: [{ uri, mimeType: 'text/markdown', text }] });
  }
  post({ jsonrpc: '2.0', id, error: { code: -32002, message: 'resource not found: ' + uri } });
}

function callTool(id, p) {
  // Like Desktop: without serverTools, tools/call is refused.
  post({ jsonrpc: '2.0', id, error: { code: -32603, message: hostCapabilities.serverTools ? 'unknown tool ' + p.name : 'IPC not available for MCP tool call' } });
}

window.addEventListener('message', (e) => {
  if (e.source !== frame.contentWindow) return;
  const m = e.data;
  log('view->host', m);
  if (m.method === 'ui/initialize') {
    reply(m.id, { protocolVersion: '2026-01-26', hostInfo: { name: 'mock-host', version: '0.0.0' },
      hostCapabilities, hostContext });
  } else if (m.method === 'ui/notifications/initialized') {
    toolResult();
  } else if (m.method === 'tools/call') {
    callTool(m.id, m.params);
  } else if (m.method === 'ui/update-model-context') {
    window.modelContexts.push(m.params);
    reply(m.id, {});
  } else if (m.method === 'ui/message') {
    window.messages.push(m.params);
    reply(m.id, {});
  } else if (m.method === 'resources/read') {
    readResource(m.id, m.params.uri);
  } else if (m.method === 'ui/request-display-mode') {
    const mode = modes.includes(m.params.mode) ? m.params.mode : hostContext.displayMode;
    frame.classList.toggle('fs', mode === 'fullscreen');
    hostContext.displayMode = mode;
    reply(m.id, { mode });
  } else if (m.id !== undefined && m.method) {
    reply(m.id, {});
  }
});
frame.src = '../dist/index.html?run=' + run;
</script>
</body>
</html>
