[package]
name = "rdm-mcp"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Throwaway MCP Apps feasibility stub for rdm"

[[bin]]
name = "rdm-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "=3.10.0", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

[dev-dependencies]
rmcp = { version = "=3.10.0", features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process"] }
jsonschema = { version = "0.33", default-features = false }
